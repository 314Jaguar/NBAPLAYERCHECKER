<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="landing">
        <h1>Welcome to the NBA Quiz</h1>
        <p>Scroll down to take the quiz and find out which NBA player you are most like!</p>
        <div class="scroll-down-indicator">&#8595; Scroll Down &#8595;</div>
    </div>
    <div class="container">
        <h1>NBA Quiz</h1>
        <div id="quiz">
            <!-- Questions will be dynamically inserted here -->
        </div>
        <button id="submit" onclick="calculateResult()">Submit</button>
    </div>
    <div id="result-container">
        <div id="result" class="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
